[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-dsl"
dynamic = ["version"]
description = "A text-based music programming language: write songs in plain text and play or export them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enginestein" }]
keywords = [
    "music",
    "dsl",
    "audio",
    "synthesis",
    "synthesizer",
    "midi",
    "sequencer",
    "tracker",
    "wav",
    "chiptune",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Software Development :: Interpreters",
]
dependencies = ["numpy"]

[project.optional-dependencies]
# Speaker playback. Without one of these you can still render, save WAV
# and export MIDI -- only song.play() needs an output backend.
playback = ["sounddevice"]
full = ["sounddevice", "pyaudio", "soundfile", "scipy"]

[project.urls]
Homepage = "https://github.com/enginestein/Music-DSL"
Repository = "https://github.com/enginestein/Music-DSL"
Issues = "https://github.com/enginestein/Music-DSL/issues"

[project.scripts]
music = "music.cli:main"

[tool.setuptools.dynamic]
version = { attr = "music.__version__" }

[tool.setuptools.packages.find]
include = ["music*"]

[tool.setuptools.package-data]
music = ["samples/*"]
